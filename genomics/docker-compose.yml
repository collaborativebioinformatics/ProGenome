# Local graph browser for the haploblock knowledge graph.
#   docker compose up -d neo4j          # then open http://localhost:7474  (user neo4j / password progenome)
#   python neo4j_load.py --chrom chr22  # loads outputs/kg/chr22 into it (a few minutes for all CARRIES edges)
#   docker compose down                 # keeps the data volume; add -v to wipe it
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: progenome-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/progenome
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # GPU pipeline image (see Dockerfile); run stages with e.g.
  #   docker compose run --rm pipeline python train_gnn.py --target ancestry
  pipeline:
    build:
      context: ..
      dockerfile: genomics/Dockerfile
    image: progenome-genomics
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/genomics/data
      - ./outputs:/app/genomics/outputs
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NX_CUGRAPH_AUTOCONFIG: "True"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  neo4j_data: {}
